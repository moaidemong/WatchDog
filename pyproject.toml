[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dog-rise-alert"
version = "0.1.0"
description = "CCTV-based dog rise failure alert project skeleton"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "OpenAI Assistant" }
]
dependencies = [
  "PyYAML>=6.0.1",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "requests>=2.32.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
