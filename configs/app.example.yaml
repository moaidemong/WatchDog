app_name: dog-rise-alert
storage:
  artifacts_dir: artifacts
  review_queue_dir: review_queue
  exports_dir: exports
ingest:
  backend: mock
  camera_id: default
  camera_index: 0
  device_path:
  rtsp_url:
  sample_fps: 2.0
  max_frames: 60
  frame_width:
  frame_height:
cameras: []
detection:
  backend: mock
  confidence_threshold: 0.50
  model_path:
  config_path:
  labels_path:
  dog_class_names:
    - dog
  input_width: 640
  input_height: 640
  scale_factor: 0.00392156862745098
  swap_rb: true
  stream_interface: PCIe
motion_gate:
  enabled: false
  roi:
  pixel_diff_threshold: 25.0
  min_changed_ratio: 0.01
pipeline:
  frame_window_size: 30
  detector_confidence_threshold: 0.50
  event_gap_seconds: 2.0
  min_event_seconds: 3.0
  alert_cooldown_seconds: 300.0
rules:
  failed_attempt_min_attempts: 2
  failed_attempt_min_duration_seconds: 10.0
  min_body_lift_ratio: 0.07
  max_progress_ratio: 0.50
notifier:
  backend: stdout
  telegram:
    bot_token_env: TELEGRAM_BOT_TOKEN
    chat_id_env: TELEGRAM_CHAT_ID
